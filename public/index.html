<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Studio</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f7f8;background:#090a0d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1d2030 0,#090a0d 42%);min-height:100vh}
main{max-width:1280px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
h1{font-size:34px;margin:0 0 8px}.muted{color:#9da2ad}.badge{border:1px solid #343945;border-radius:999px;padding:8px 12px;color:#b8bec9;background:#11131a}
.grid{display:grid;grid-template-columns:420px 1fr;gap:18px}.card{background:#111319cc;border:1px solid #272b35;border-radius:18px;padding:20px;box-shadow:0 12px 50px #0005}
label{display:block;font-size:13px;font-weight:700;color:#b9bec8;margin:0 0 8px}
textarea,select{width:100%;background:#0a0c10;color:#fff;border:1px solid #303541;border-radius:12px;padding:12px;font:inherit}textarea{resize:vertical;min-height:180px}
select{height:46px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer;background:#f5f5f5;color:#0a0b0e}button.secondary{background:#20232c;color:#fff;border:1px solid #353946}button.primary{grid-column:1/-1}
button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:14px;padding:10px 12px;border-radius:10px;background:#0b0d12;color:#aeb4c0;font-size:14px}
.progress{height:6px;background:#20232c;border-radius:99px;overflow:hidden;margin-top:10px}.progress>i{display:block;height:100%;width:0%;background:#f5f5f5;transition:width .3s}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{background:#1b1e26;color:#bfc4ce;border:1px solid #30343e}.tab.active{background:#fff;color:#111}
pre{white-space:pre-wrap;word-break:break-word;max-height:560px;overflow:auto;background:#090b0f;border:1px solid #242832;border-radius:12px;padding:14px;font-size:12px}
.preview{margin-top:14px;display:none}.preview video,.preview img{width:100%;border-radius:14px;border:1px solid #2a2e38;max-height:560px;object-fit:contain;background:#050608}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.links a{color:#fff;background:#1b1e26;padding:8px 10px;border-radius:9px;text-decoration:none}
@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}}
</style></head>
<body><main>
<div class="top"><div><h1>AI Video Studio</h1><div class="muted">Professional YouTube video, Shorts en thumbnail productie.</div></div><div id="health" class="badge">Checking studio…</div></div>
<div class="grid">
<section class="card">
<label for="format">Output formaat</label>
<select id="format">
<option value="youtube_landscape">YouTube video · 1920×1080 · 16:9</option>
<option value="youtube_thumbnail">YouTube thumbnail · 1280×720 · 16:9</option>
<option value="shorts">YouTube Shorts · 1080×1920 · 9:16</option>
<option value="shorts_thumbnail">Shorts thumbnail · 1080×1920 · 9:16</option>
</select>
<br><br><label for="brief">Creative brief</label>
<textarea id="brief" placeholder="Beschrijf onderwerp, doelgroep, stijl, verhaal, personages en gewenste tone of voice. De AI maakt hier een volledige productie van."></textarea>
<div class="actions">
<button id="produceBtn" class="primary" onclick="produce()">Create & render — Free AI visuals</button>
<button class="secondary" onclick="plan()">Plan only</button>
<button class="secondary" onclick="save()">Save project</button>
</div>
<div id="status" class="status">Safe Free Mode — geen betaalde AI-generatie.</div><div class="progress"><i id="progress"></i></div>
</section>
<section class="card">
<div class="tabs"><button class="tab active" onclick="showTab('result',this)">Result</button><button class="tab" onclick="showTab('plan',this)">Production plan</button><button class="tab" onclick="showTab('storyboard',this)">Storyboard</button></div>
<div id="result"><div id="empty" class="muted">Your rendered result will appear here.</div><div id="preview" class="preview"></div><div id="links" class="links"></div></div>
<pre id="plan" style="display:none">{}</pre><pre id="storyboard" style="display:none">{}</pre>
</section>
</div></main>
<script src="https://js.puter.com/v2/"></script>
<script>
let current=null,activeJob=null,pollTimer=null;
const PUTER_IMAGE_MODEL="gemini-3.1-flash-image-preview";
const $=s=>document.querySelector(s);
async function api(url,body){const r=await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const x=await r.json();if(!r.ok)throw new Error(x.error||"Request failed");return x;}
function setStatus(x){$("#status").textContent=x;}
function setProgress(n){$("#progress").style.width=Math.max(0,Math.min(100,n))+"%";}
function showTab(name,button){["result","plan","storyboard"].forEach(x=>$("#"+x).style.display=x===name?"block":"none");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));button.classList.add("active");}
async function health(){try{const r=await fetch("/api/health");const x=await r.json();$("#health").textContent=x.safe_free_mode?"Studio online · Safe Free Mode":"Studio online · Paid generation enabled";}catch{$("#health").textContent="Studio offline";}}
async function plan(){try{setStatus("Creating production plan…");setProgress(20);current=await api("/api/plan",{brief:$("#brief").value,format_id:$("#format").value});$("#plan").textContent=JSON.stringify(current,null,2);$("#storyboard").textContent=JSON.stringify(current.scenes||[],null,2);showTab("plan",document.querySelectorAll(".tab")[1]);setProgress(100);setStatus("Plan ready.");}catch(e){setProgress(0);setStatus("Error: "+e.message);}}
async function uploadVisual(dataUrl){
 const r=await api("/api/assets/image",{data_url:dataUrl});
 return r.path;
}
function aspectFor(format){
 if(format.id==="shorts"||format.id==="shorts_thumbnail") return {w:9,h:16};
 return {w:16,h:9};
}
async function generateVisualAssets(plan,format){
 setProgress(18);setStatus("Generating professional AI visuals with the free Puter allowance…");
 const assets={};
 const scenes=Array.isArray(plan.scenes)?plan.scenes:[];
 let reference=null;
 for(let i=0;i<scenes.length;i++){
  const scene=scenes[i];
  const packText=Array.isArray(scene.visual_packs)?scene.visual_packs.join(", "):"cinematic";
  const prompt=[
   "Professional cinematic YouTube still frame, photorealistic, premium production quality.",
   "No text, no subtitles, no logos, no watermark.",
   "Maintain realistic lighting, depth, composition and strong subject focus.",
   "Visual style packs: "+packText+".",
   "Scene visual: "+(scene.visual_prompt||""),
   "Action: "+(scene.action||""),
   "Continuity: "+(scene.continuity||""),
   reference ? "Use the supplied previous frame as a visual continuity reference. Preserve the same main characters, faces, wardrobe, environment and visual style while changing the composition to match this scene." : ""
  ].filter(Boolean).join("\n");
  const options={model:PUTER_IMAGE_MODEL,quality:"2K",ratio:aspectFor(format)};
  if(reference) options.input_images=[reference];
  const image=await puter.ai.txt2img(prompt,options);
  const dataUrl=image?.src;
  if(!dataUrl||!dataUrl.startsWith("data:image/")) throw new Error("Puter returned no usable image for scene "+(i+1));
  assets[scene.id||String(i+1)]=await uploadVisual(dataUrl);
  reference=dataUrl;
  setProgress(18+Math.round(((i+1)/Math.max(1,scenes.length))*27));
  setStatus("AI visual "+(i+1)+"/"+scenes.length+" generated…");
 }
 return assets;
}
async function generateThumbnailAsset(plan,format){
 setProgress(35);setStatus("Generating premium AI thumbnail…");
 const ratio=aspectFor(format);
 const prompt=[
  "High-end YouTube thumbnail artwork, cinematic and instantly readable at small size.",
  "Strong focal subject, dramatic lighting, clear foreground/background separation, vivid but professional color grading.",
  "Do not render any words, letters, logos or watermarks; typography will be added separately.",
  "Concept: "+(plan.thumbnail_prompt||plan.title||"YouTube thumbnail")
 ].join("\n");
 const image=await puter.ai.txt2img(prompt,{model:PUTER_IMAGE_MODEL,quality:"2K",ratio});
 const dataUrl=image?.src;
 if(!dataUrl||!dataUrl.startsWith("data:image/")) throw new Error("Puter returned no usable thumbnail image.");
 return uploadVisual(dataUrl);
}
async function produce(){
 try{
  if(!$("#brief").value.trim())throw new Error("Add a creative brief first.");
  $("#produceBtn").disabled=true;setProgress(5);setStatus("Creating production plan…");
  current=await api("/api/plan",{brief:$("#brief").value,format_id:$("#format").value});
  $("#plan").textContent=JSON.stringify(current,null,2);
  $("#storyboard").textContent=JSON.stringify(current.scenes||[],null,2);
  const formatInfo=await fetch("/api/formats/"+encodeURIComponent(current.format?.id||$("#format").value)).then(r=>r.json());
  let payload={brief:$("#brief").value,format_id:$("#format").value,plan:current};
  if(String(formatInfo.id||"").includes("thumbnail")){
   payload.image_file=await generateThumbnailAsset(current,formatInfo);
  }else{
   payload.visual_assets=await generateVisualAssets(current,formatInfo);
  }
  setProgress(48);setStatus("AI visuals ready. Rendering video and audio…");
  const result=await api("/api/production-pipeline",payload);
  setProgress(100);
  current=result.plan;
  $("#plan").textContent=JSON.stringify(result.plan,null,2);
  $("#storyboard").textContent=JSON.stringify(result.storyboard||[],null,2);
  renderResult(result);
  setStatus("Production complete.");
  $("#produceBtn").disabled=false;
 }catch(e){setProgress(0);setStatus("Production error: "+e.message);$("#produceBtn").disabled=false;}
}
async function pollJob(){
 clearTimeout(pollTimer);
 try{
  const r=await fetch("/api/production-jobs/"+activeJob),job=await r.json();
  if(!r.ok)throw new Error(job.error||"Could not read production job");
  if(job.status==="queued"){setProgress(8);setStatus("Job queued…");return pollTimer=setTimeout(pollJob,1500);}
  if(job.status==="running"){setProgress(45);setStatus("Generating scenes, video and audio…");return pollTimer=setTimeout(pollJob,3000);}
  if(job.status==="failed"){setProgress(0);setStatus("Production error: "+(job.error||"Unknown error"));$("#produceBtn").disabled=false;return;}
  if(job.status==="completed"){
   setProgress(100);const x=job.result;current=x.plan;$("#plan").textContent=JSON.stringify(x.plan,null,2);$("#storyboard").textContent=JSON.stringify(x.storyboard||[],null,2);renderResult(x);setStatus("Production complete.");$("#produceBtn").disabled=false;
  }
 }catch(e){setProgress(0);setStatus("Production error: "+e.message);$("#produceBtn").disabled=false;}
}
function renderResult(x){$("#empty").style.display="none";$("#links").innerHTML="";$("#preview").style.display="block";const url=x.rendered?.output_url;if(!url)return;if(x.format.id.includes("thumbnail")){$("#preview").innerHTML='<img src="'+url+'" alt="Generated thumbnail">';}else{$("#preview").innerHTML='<video controls playsinline src="'+url+'"></video>';}const a=document.createElement("a");a.href=url;a.target="_blank";a.textContent="Open output";$("#links").appendChild(a);if(x.subtitles?.output_url){const s=document.createElement("a");s.href=x.subtitles.output_url;s.target="_blank";s.textContent="Open subtitles (.srt)";$("#links").appendChild(s);}}
async function save(){try{if(!current)await plan();const x=await api("/api/projects",{plan:current,brief:$("#brief").value,format_id:$("#format").value});setStatus("Project saved: "+x.id);}catch(e){setStatus("Save error: "+e.message);}}
health();
</script></body></html>
